# Second front-end for ghostwave: the same terminal core, presented by iced.
#
# [workspace] keeps this crate out of any surrounding workspace while still
# letting it depend on the app package by path (that is where the toolkit-free
# modules live: pty, term (VT + pty + selection), layout, session, config,
# theme, search, palette, clipboard).
#
# Merge path: this crate grows to parity, then the repo flips its default binary
# to it and the macroquad front-end is deleted. Nothing in the app crate changes
# until that flip.
[workspace]

[package]
name = "ghost-iced"
version = "0.1.0"
edition = "2021"

[dependencies]
ghostwave = { path = ".." }

iced = { version = "0.14", features = ["canvas"] }
libghostty-vt = { version = "0.2.1" }
nix = { version = "0.31", features = ["term", "fs", "signal", "process", "user", "ioctl", "poll"] }
fontdue = "0.9"

[profile.release]
lto = true
