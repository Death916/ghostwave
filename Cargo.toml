[package]
name = "ghostwave"
version = "0.1.3"
edition = "2024"
description = "A waveterm-style terminal built on libghostty-vt (Rust), with zellij-style keybindings, presented by iced"
license = "MIT"

[lib]
name = "ghostwave"
path = "src/lib.rs"

[[bin]]
name = "ghostwave"
path = "src/main.rs"

[dependencies]
# Ghostty terminal emulation, safe Rust bindings (vendored zig build of libghostty-vt)
libghostty-vt = { version = "0.2.2", features = ["png"] }
# the front-end: windowing, layout, widgets and the painting surface
iced = { version = "0.14", features = ["canvas"] }
# PTY handling (forkpty, winsize) — pty module lives under the "term" feature
nix = { version = "0.31.2", features = ["term", "fs", "signal", "process", "user", "ioctl", "poll"] }
# font glyph coverage checks for the fallback chain
fontdue = "0.9"
# config file + session state
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# kitty graphics PNG decode (DecodePng impl in term.rs)
png = "0.18"
# the AI pane's chat request (blocking HTTP in a worker thread)
ureq = "2.10"
# Native cross-platform clipboard (Wayland + X11 in-process)
arboard = { version = "3", features = ["wayland-data-control"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = true
