[package]
name = "ghostd"
version = "0.1.3"
edition = "2024"
description = "ghostwave remote session daemon — headless, UI-less durable sessions over ssh"
license = "MIT"

[lib]
name = "ghostd"
path = "src/lib.rs"

[[bin]]
name = "ghostd"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31.2", features = ["term", "fs", "signal", "process", "user", "ioctl"] }

[profile.release]
lto = true
